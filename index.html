<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Quest V11</title>
<style>
body{margin:0;font-family:system-ui,"Noto Sans Thai",sans-serif;background:linear-gradient(135deg,#f5f2ff,#fff5fb);color:#28253d}.wrap{max-width:900px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;font-size:22px}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:15px 0}.nav button,.btn,.choice{border:0;border-radius:16px;padding:13px;font:inherit;font-weight:800;cursor:pointer}.nav button{background:#fff;border:1px solid #e8e4f2}.active,.btn{background:linear-gradient(135deg,#7355ff,#ff75b7);color:white}.card{background:#fff;border:1px solid #e8e4f2;border-radius:24px;padding:20px;box-shadow:0 12px 35px #6b54a012;margin:12px 0}.hero{color:white;background:linear-gradient(135deg,#7155ff,#a966ff,#ff76b7);border-radius:28px;padding:26px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.tag{display:inline-block;padding:5px 9px;border-radius:99px;background:#f0edff;color:#6349e7;font-size:12px;font-weight:800;margin:2px}.stim{background:#fff7e5;border:1px solid #f0d99e;border-radius:18px;padding:15px;margin:15px 0}.choice{display:block;width:100%;text-align:left;background:white;border:2px solid #e9e5f2;margin:9px 0}.selected{border-color:#7355ff;background:#f0edff}.correct{border-color:#17a36f;background:#eafff5}.wrong{border-color:#df5368;background:#fff0f3}.explain{background:#f8f7ff;border-radius:18px;padding:16px;margin-top:15px}.bar{height:11px;background:#ece9f5;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#7355ff,#ff75b7)}small,.muted{color:#77738b}.metric{display:flex;justify-content:space-between;font-weight:800;margin:9px 0}
@media(max-width:650px){.grid{grid-template-columns:1fr}.nav{grid-template-columns:repeat(2,1fr)}}
</style><body><div id="app"></div><script>
let Q=[],L={},S={page:"home",session:[],i:0,sel:null,checked:false,score:0,history:JSON.parse(localStorage.tqhist||"[]"),xp:+localStorage.tqxp||0};
const $=x=>document.querySelector(x);const sh=a=>[...a].sort(()=>Math.random()-.5);
fetch("data/questions.json").then(r=>r.json()).then(x=>{Q=x;return fetch("data/learning.json")}).then(r=>r.json()).then(x=>{L=x;render()});
function save(){localStorage.tqhist=JSON.stringify(S.history);localStorage.tqxp=S.xp}
function nav(){return `<div class=top><div class=logo>🌸 Teacher Quest <small>V11</small></div><b>⚡${S.xp} XP</b></div><div class=nav>${["home","learn","play","analysis"].map((p,i)=>`<button class="${S.page==p?"active":""}" onclick="S.page='${p}';render()">${["🏠 หน้าแรก","📚 เรียน","🎮 เล่น","📊 วิเคราะห์"][i]}</button>`).join("")}</div>`}
function render(){let b=S.page=="home"?home():S.page=="learn"?learn():S.page=="play"?play():S.page=="analysis"?analysis():S.page=="exam"?exam():done();$("#app").innerHTML=`<div class=wrap>${nav()}${b}</div>`}
function home(){return `<div class=hero><h1>สนามฝึกครู 🌟</h1><p>คลังข้อสอบต้นฉบับ 167 ข้อ • สุ่มข้ามหมวด • สถานการณ์มาครบ • เฉลยแบบสอน</p><button class=btn onclick="start()">⚔️ เริ่มภารกิจ</button></div><div class=grid><div class=card><h3>📚 เรียน</h3><p class=muted>เลือกหมวดและอ่านกรอบคิดก่อนลงสนาม</p><button class=btn onclick="S.page='learn';render()">เปิดห้องเรียน</button></div><div class=card><h3>🎮 กิจกรรม</h3><p class=muted>ตอบเร็วหรือทบทวนข้อที่เคยผิด</p><button class=btn onclick="S.page='play';render()">เปิดสนามกิจกรรม</button></div></div>`}
function learn(){let keys=Object.keys(L);return `<div class=card><h2>📚 ห้องเรียน</h2><p class=muted>เนื้อหาแยกหมวด ไม่ปนกับหน้าข้อสอบ</p><div class=grid>${keys.map(k=>`<div class=card><span class=tag>${Q.filter(q=>q.learning_hub==k).length} ข้อ</span><h3>${L[k].title}</h3><p>${L[k].goal}</p><button class=btn onclick="lesson(${JSON.stringify(k)})">เรียนหมวดนี้</button></div>`).join("")}</div></div>`}
function lesson(k){let l=L[k];$("#app").innerHTML=`<div class=wrap>${nav()}<div class=card><button onclick="S.page='learn';render()">← กลับ</button><h2>${l.title}</h2><p class=muted>${l.goal}</p>${l.points.map((x,i)=>`<div class=card><b>${i+1}. ${x}</b></div>`).join("")}<button class=btn onclick="start(${JSON.stringify(k)})">📝 ฝึกข้อสอบหมวดนี้</button></div></div>`}
function start(k){let pool=k?Q.filter(q=>q.learning_hub==k):Q;S.session=sh(pool);S.i=0;S.sel=null;S.checked=false;S.score=0;S.page="exam";render()}
function play(){return `<div class=card><h2>🎮 สนามกิจกรรม</h2><div class=grid><div class=card><h3>⚡ ตอบเร็ว</h3><p>10 ข้อสุ่มข้าม 5 หมวด</p><button class=btn onclick="S.session=sh(Q).slice(0,10);S.i=0;S.sel=null;S.checked=false;S.score=0;S.page='exam';render()">เล่น</button></div><div class=card><h3>🧠 ทบทวนข้อผิด</h3><p>หยิบข้อที่เคยผิดมาเล่นซ้ำ</p><button class=btn onclick="review()">ทบทวน</button></div></div></div>`}
function review(){let ids=new Set(S.history.filter(x=>!x.ok).map(x=>x.id));let p=Q.filter(q=>ids.has(q.id));if(!p.length)return alert("ยังไม่มีข้อที่ผิด");S.session=sh(p);S.i=0;S.sel=null;S.checked=false;S.score=0;S.page="exam";render()}
function exam(){let q=S.session[S.i];if(!q._o)q._o=sh(q.choices.map((text,index)=>({text,index})));let o=q._o;return `<div class=card><div class=metric><span>ข้อ ${S.i+1}/${S.session.length}</span><span>${q.category}</span></div><div class=bar><div class=fill style="width:${S.i/S.session.length*100}%"></div></div><p><span class=tag>${q.question_type}</span><span class=tag>คลังต้นฉบับ</span></p>${q.has_stimulus?`<div class=stim><b>📌 ข้อมูล/สถานการณ์ประกอบ</b><p>${q.stimulus||"ข้อมูลประกอบจากต้นฉบับ"}</p></div>`:""}<h2>${q.question}</h2>${o.map(x=>`<button class="choice ${S.sel===x.index?"selected":""} ${S.checked?(x.index===q.answer_index?"correct":S.sel===x.index?"wrong":""):""}" onclick="pick(${x.index})">${x.text}</button>`).join("")}${S.checked?explain(q):`<button class=btn style="width:100%" onclick="check()">ตรวจคำตอบ</button>`}</div>`}
function pick(i){if(S.checked)return;S.sel=S.sel===i?null:i;render()}function check(){if(S.sel===null)return alert("เลือกคำตอบก่อน");S.checked=true;let q=S.session[S.i],ok=S.sel===q.answer_index;if(ok)S.score++;S.xp+=ok?10:2;S.history.push({id:q.id,category:q.category,type:q.question_type,ok});save();render()}
function explain(q){let ok=S.sel===q.answer_index;return `<div class=explain><h2>${ok?"✅ ถูกต้อง":"❌ ยังไม่ถูก"}</h2><h3>เฉลย: ${q.answer_text}</h3><p><b>หลักคิด:</b> ${q.has_stimulus?"อ่านข้อมูล/สถานการณ์ก่อน แล้วเชื่อมเงื่อนไขกับตัวเลือก":"จับคำสำคัญในคำถาม แล้วตรวจว่าตัวเลือกสอดคล้องกับหลักการและเงื่อนไขหรือไม่"} </p><p><b>ความรู้เสริม:</b> ${q.category} — อย่าจำแค่ตัวเลือก ให้จำความสัมพันธ์ระหว่างหลักการกับสถานการณ์</p><p><b>อ้างอิง:</b> ${q.answer_source||"ข้อมูลจากคลังข้อสอบ"}</p><button class=btn style="width:100%" onclick="next()">ไปข้อถัดไป →</button></div>`}
function next(){S.i++;S.sel=null;S.checked=false;if(S.i>=S.session.length)S.page="done";render()}
function done(){let p=Math.round(S.score/S.session.length*100);return `<div class=card style="text-align:center"><div style="font-size:60px">🎉</div><h2>จบภารกิจ</h2><h1>${S.score}/${S.session.length} • ${p}%</h1><button class=btn onclick="S.page='analysis';render()">ดูการวิเคราะห์</button></div>`}
function analysis(){let cats=Object.keys(L);return `<div class=card><h2>📊 วิเคราะห์ตัวเอง</h2><p class=muted>เปอร์เซ็นต์คำนวณจากข้อที่คุณตอบจริง</p>${cats.map(k=>{let h=S.history.filter(x=>x.category==k),p=h.length?Math.round(h.filter(x=>x.ok).length/h.length*100):0;return `<div class=card><div class=metric><span>${k}</span><span>${h.length?p+"%":"ยังไม่มีข้อมูล"}</span></div><div class=bar><div class=fill style="width:${p}%"></div></div><small>${h.filter(x=>x.ok).length}/${h.length} ถูก</small></div>`}).join("")}<h3>ตามประเภทโจทย์</h3>${["ความรู้/หลักการ","วิเคราะห์หลักการ/ตัดสินใจ","วิเคราะห์สถานการณ์","วิเคราะห์ข้อมูล/สถานการณ์","คำนวณ/ตีความข้อมูล"].map(t=>{let h=S.history.filter(x=>x.type==t),p=h.length?Math.round(h.filter(x=>x.ok).length/h.length*100):0;return `<div class=metric><span>${t}</span><span>${h.length?p+"%":"—"}</span></div>`}).join("")}</div>`}
</script></body></html>
