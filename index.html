const save=()=>localStorage.setItem('tq9',JSON.stringify(S));const app=document.getElementById('app');
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
function go(p){document.querySelectorAll('[data-go]').forEach(b=>b.classList.toggle('active',b.dataset.go===p));({home,learn,exam,stats}[p])()}
function home(){app.innerHTML=`<div class=top><div class=logo>🌷 Teacher Quest V9</div><span class=pill>⭐ ${S.xp} XP</span></div><section class=hero><span class=tag>MASTER QUESTION BANK</span><h1>คลังข้อสอบ + ห้องเรียน</h1><p class=muted>เลือกหมวดเรียน • ทำทีละข้อ • เปลี่ยนคำตอบได้ • เฉลยแบบสอน</p><div class=grid><button class=btn onclick="go('exam')">📝 เข้าคลังข้อสอบ</button><button class="btn outline" onclick="go('learn')">📚 เลือกหมวดเรียน</button></div></section><div class=grid><div class=card>🧠<b>${D.questions.length} รายการ</b><br><span class=muted>ข้อสอบที่ถอดเข้าฐานข้อมูล</span></div><div class=card>📚<b>${D.lessons.length} บท</b><br><span class=muted>บทเรียนแกนหลัก</span></div></div>`}
function learn(){let cats=['ทั้งหมด',...D.categories];app.innerHTML=`<div class=top><div class=logo>📚 ห้องเรียน</div></div><div class=filter>${cats.map(c=>`<button class="${S.filter===c?'on':''}" onclick="setFilter('${c.replaceAll("'","\\'")}')">${c}</button>`).join('')}</div>${D.lessons.filter(l=>S.filter==='ทั้งหมด'||l.category.includes(S.filter.split(' ')[0])).map(l=>`<article class=card><span class=tag>${l.category}</span><h3>${l.title}</h3><p>${l.content}</p><b>🔑 จำให้ได้</b><p>${l.memory}</p></article>`).join('')||'<div class=card>ยังไม่มีบทเรียนในหมวดนี้</div>'}`}
function setFilter(x){S.filter=x;save();learn()}
function current(){return D.questions[S.idx%D.questions.length]}
function exam(){let q=current();app.innerHTML=`<div class=top><div class=logo>📝 ข้อสอบทีละข้อ</div><span class=pill>ข้อ ${S.idx+1}</span></div><div class=card><span class=tag>${q.category}</span> <span class=tag>${q.type}</span><div class=small>แหล่ง: ${q.source}</div></div><section class=q><h2>${q.question}</h2>${q.choices.map((c,i)=>`<button class="choice ${S.sel===i?'sel':''} ${S.done&&q.answer===i?'ok':''} ${S.done&&S.sel===i&&q.answer!==i?'no':''}" onclick="pick(${i})">${c}</button>`).join('')}${S.done?`<div class="explain ${q.answer===null?'danger':''}"><b>${q.answer===null?'📌 ข้อนี้ยังไม่มีเฉลยที่ยืนยันได้':' '+(S.sel===q.answer?'✅ ถูกต้อง':'❌ ยังไม่ถูก')}</b><p><b>เหตุผล:</b> ${q.explanation}</p><p><b>ความรู้เสริม:</b> ${q.knowledge}</p></div>${q.answer!==null?'<button class=btn onclick="next()">ข้อถัดไป →</button>':'<button class="btn outline" onclick="next()">ข้ามไปข้อถัดไป →</button>'}`:`<button class=btn onclick="submitQ()">ตรวจคำตอบ</button>${S.sel!==null?'<button class="btn outline" onclick="clearQ()">ยกเลิก/เปลี่ยนคำตอบ</button>':''}`}</section>`}
function pick(i){if(!S.done){S.sel=S.sel===i?null:i;save();exam()}}function clearQ(){S.sel=null;save();exam()}function submitQ(){if(S.sel===null){alert('เลือกคำตอบก่อนครับ');return}let q=current();S.done=true;if(q.answer!==null){S.total++;if(S.sel===q.answer){S.correct++;S.xp+=20}else S.xp+=5}save();exam()}function next(){S.idx++;S.sel=null;S.done=false;save();exam()}
function stats(){let p=S.total?Math.round(S.correct/S.total*100):0;let by={};D.questions.forEach(q=>by[q.category]=(by[q.category]||0)+1);app.innerHTML=`<div class=top><div class=logo>📊 วิเคราะห์</div></div><div class=grid><div class=card><b>${S.total}</b><br>ข้อที่มีผลคะแนน</div><div class=card><b>${S.correct}</b><br>ตอบถูก</div><div class=card><b>${p}%</b><br>ความแม่น</div><div class=card><b>${S.xp}</b><br>XP</div></div><div class=card><h3>แยกตามหมวด</h3>${Object.entries(by).map(([k,v])=>`<p>📌 ${k}<br><b>${v} รายการ</b></p>`).join('')}</div><div class=card><p class=muted>หมายเหตุ: ข้อที่ยังไม่มีเฉลยยืนยันจะไม่ถูกนำไปคำนวณคะแนน เพื่อป้องกันการเดาคำตอบจากระบบ</p></div>`}go('home');
</script></html>
