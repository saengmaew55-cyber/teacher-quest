function learn(){
 const keys=Object.keys(LEARNING);
 return `<div class="card"><h2>📚 ห้องเรียน</h2><p class="muted">เลือกหมวดที่ต้องการเรียน เนื้อหาอยู่แยกจากหน้าทำข้อสอบ</p><div class="grid">
 ${keys.map(k=>`<div class="card"><span class="tag">${QUESTIONS.filter(q=>q.learning_hub===k).length} ข้อในคลัง</span><h3>${esc(LEARNING[k].title)}</h3><p>${esc(LEARNING[k].goal)}</p><button class="btn" onclick="openLesson(${JSON.stringify(k)})">เข้าเรียน →</button></div>`).join("")}</div></div>`;
}
function openLesson(k){state.lessonKey=k;state.page="lesson";renderLesson();}
function renderLesson(){
 const k=state.lessonKey,l=LEARNING[k];
 $("app").innerHTML=`<div class="wrap">${nav()}<div class="card"><button class="btn secondary" onclick="go('learn')">← กลับห้องเรียน</button><h2>${esc(l.title)}</h2><p class="muted">${esc(l.goal)}</p>
 ${l.points.map((p,i)=>`<div class="lesson"><b>${i+1}. ${esc(p)}</b></div>`).join("")}
 <div class="actions"><button class="btn" onclick="startExam(k,15)">📝 ฝึกข้อสอบหมวดนี้</button></div></div></div>`;
}
function play(){
 return `<div class="card"><h2>🎮 สนามกิจกรรม</h2><div class="grid">
 <div class="card"><h3>⚡ Quick Quest</h3><p>15 ข้อสุ่มจากทั้งคลัง</p><button class="btn" onclick="startExam('all',15)">เล่นเลย</button></div>
 <div class="card"><h3>📚 Full Run</h3><p>เล่นครบทุกข้อในคลัง ${QUESTIONS.length} ข้อ</p><button class="btn" onclick="startExam('all',QUESTIONS.length)">เริ่ม</button></div>
 <div class="card"><h3>🧠 Wrong Answer Lab</h3><p>กลับไปฝึกเฉพาะข้อที่เคยผิด</p><button class="btn" onclick="review()">ทบทวน</button></div>
 </div></div>`;
}
function review(){
 const ids=new Set(state.history.filter(x=>x.ok===false).map(x=>x.id));
 const p=QUESTIONS.filter(q=>ids.has(q.id));
 if(!p.length){alert("ตอนนี้ยังไม่มีข้อที่ผิดให้ทบทวน");return;}
 state.session=shuffle(p);state.index=0;state.selected=null;state.checked=false;state.score=0;state.answered=0;state.page="exam";render();
}
function startExam(filter,count){
 let pool=filter==="all"?QUESTIONS:QUESTIONS.filter(q=>q.learning_hub===filter);
 if(!pool.length){alert("ยังไม่มีข้อสอบในหมวดนี้");return;}
 state.session=shuffle(pool).slice(0,Math.min(count,pool.length));state.index=0;state.selected=null;state.checked=false;state.score=0;state.answered=0;state.optionOrders={};state.page="exam";render();
}
function orderFor(q){
 if(!state.optionOrders[q.id])state.optionOrders[q.id]=shuffle(q.choices.map((text,index)=>({text,index})));
 return state.optionOrders[q.id];
}
function exam(){
 const q=state.session[state.index]; if(!q)return done();
 const order=orderFor(q), pct=Math.round((state.index/state.session.length)*100);
 const key=q._answer0;
 const hasKey=Number.isInteger(key);
 let buttons=order.map(o=>{
   let cls="choice "+(state.selected===o.index?"selected ":"");
   if(state.checked&&hasKey){if(o.index===key)cls+="correct ";else if(o.index===state.selected)cls+="wrong ";}
   return `<button class="${cls}" ${state.checked?"disabled":""} onclick="pick(${o.index})">${esc(o.text)}</button>`;
 }).join("");
 let feedback=state.checked?explain(q):`<button class="btn" style="width:100%" onclick="checkAnswer()">ตรวจคำตอบ</button>`;
 return `<div class="card"><div class="metric"><span>ข้อ ${state.index+1}/${state.session.length}</span><span>${esc(q.category)}</span></div>
 <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
 <p><span class="tag">${esc(q.question_type)}</span><span class="tag">คลังข้อสอบ</span></p>
 ${q.has_stimulus?`<div class="stim"><b>📌 ข้อมูล/สถานการณ์ประกอบ</b><div>${esc(q.stimulus||"")}</div></div>`:""}
 <h2>${esc(q.question)}</h2>${buttons}${feedback}</div>`;
}
function pick(i){if(state.checked)return;state.selected=state.selected===i?null:i;render();}
function checkAnswer(){
 if(state.selected===null){alert("เลือกคำตอบก่อนตรวจ");return;}
 const q=state.session[state.index], key=q._answer0, hasKey=Number.isInteger(key), ok=hasKey&&state.selected===key;
 state.checked=true;state.answered++;
 if(ok){state.score++;state.xp+=10;}else{state.xp+=2;}
 state.history.push({id:q.id,category:q.category,type:q.question_type,ok,hasKey,at:Date.now()});save();render();
}
function explain(q){
 const hasKey=Number.isInteger(q._answer0), ok=hasKey&&state.selected===q._answer0;
 const picked=q.choices[state.selected]??"ไม่ได้เลือก";
 if(!hasKey){
   return `<div class="explain"><div class="notice"><b>ℹ️ ข้อนี้ยังไม่มีเฉลยในข้อมูลที่ถอดจากต้นฉบับ</b><br>คุณยังสามารถฝึกโจทย์และอ่านข้อมูลประกอบได้ แต่ระบบจะไม่นับถูก/ผิดจากการเดาเฉลยเอง</div>
   <p><b>ตัวเลือกที่เลือก:</b> ${esc(picked)}</p><p><b>ที่มา:</b> ${esc(q.source_set||"คลังข้อสอบต้นฉบับ")}</p>
   <button class="btn" style="width:100%" onclick="next()">ไปข้อถัดไป →</button></div>`;
 }
 const answer=q.answer_text||q.choices[q._answer0];
 const result=ok?`<h2>✅ ถูกต้อง</h2>`:`<h2>❌ ยังไม่ถูก</h2>`;
 return `<div class="explain">${result}<h3>เฉลย: ${esc(answer)}</h3>
 <p><b>เหตุผลจากข้อสอบ:</b> ${esc(q.answer_source||"มีเฉลยระบุไว้ในข้อมูลต้นฉบับ")}</p>
 <p><b>หลักคิดที่ควรใช้:</b> ${esc(q.has_stimulus?"อ่านข้อมูล/สถานการณ์ทั้งหมดก่อน แล้วค่อยจับเงื่อนไขสำคัญมาเทียบกับตัวเลือก":"แยกสิ่งที่โจทย์ถามออกจากตัวเลือก แล้วตรวจว่าตัวเลือกตอบตรงเงื่อนไขของโจทย์หรือไม่")}</p>
 <p><b>ความรู้เสริม:</b> ข้อนี้อยู่ในหมวด <b>${esc(q.category)}</b> และเป็นโจทย์ประเภท <b>${esc(q.question_type)}</b> ดังนั้นเวลาพบโจทย์ใหม่ให้ใช้หลักคิดของหมวดและประเภทนี้ ไม่ควรจำแค่ตำแหน่งคำตอบ</p>
 <p class="tiny">ที่มา: ${esc(q.source_set||"คลังข้อสอบ")}</p>
 <button class="btn" style="width:100%" onclick="next()">ไปข้อถัดไป →</button></div>`;
}
function next(){state.index++;state.selected=null;state.checked=false;if(state.index>=state.session.length)state.page="done";render();}
function done(){
 const p=state.session.length?Math.round(state.score/state.session.length*100):0;
 return `<div class="card center"><div class="big">🎉</div><h2>จบภารกิจ</h2><div class="big">${state.score}/${state.session.length}</div><p>คะแนน ${p}% • ได้ XP เพิ่มจากการฝึก</p>
 <div class="actions" style="justify-content:center"><button class="btn" onclick="go('analysis')">ดูการวิเคราะห์</button><button class="btn secondary" onclick="startExam('all',15)">เล่นอีกครั้ง</button></div></div>`;
}
function analysis(){
 const cats=Object.keys(LEARNING);
 const catCards=cats.map(k=>{
   const h=state.history.filter(x=>x.category===k&&x.hasKey);const correct=h.filter(x=>x.ok).length;const p=h.length?Math.round(correct/h.length*100):null;
   return `<div class="card"><div class="metric"><span>${esc(k)}</span><span>${p===null?"ยังไม่มีข้อมูล":p+"%"}</span></div><div class="bar"><div class="fill" style="width:${p||0}%"></div></div><div class="tiny">${correct}/${h.length} ถูก (เฉพาะข้อที่มีเฉลย)</div></div>`;
 }).join("");
 const types=["ความรู้/หลักการ","วิเคราะห์หลักการ/ตัดสินใจ","วิเคราะห์สถานการณ์","วิเคราะห์ข้อมูล/สถานการณ์","คำนวณ/ตีความข้อมูล"];
 const typeCards=types.map(t=>{const h=state.history.filter(x=>x.type===t&&x.hasKey);const c=h.filter(x=>x.ok).length;const p=h.length?Math.round(c/h.length*100):null;return `<div class="metric"><span>${esc(t)}</span><span>${p===null?"—":p+"%"}</span></div>`}).join("");
 return `<div class="card"><h2>📊 วิเคราะห์ตัวเอง</h2><p class="muted">เปอร์เซ็นต์แยกตามหมวดและประเภทโจทย์ คำนวณจากข้อที่มีเฉลยในฐานข้อมูล</p>${catCards}<h3>แยกตามประเภทข้อสอบ</h3>${typeCards}</div>`;
}
safeLoad();render();
</script>
</body>
</html>
