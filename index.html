<script>
const DATA={"questions": [{"id": "q01", "category": "การวัด ประเมินผล และการวิจัยทางการศึกษา", "type": "วิเคราะห์งานวิจัย", "level": "Level 3", "question": "ในงานวิจัยที่ศึกษาผลของกิจกรรมการเรียนรู้แบบร่วมมือโดยใช้เทคนิคการจัดกลุ่มแบบคละผลสัมฤทธิ์ต่อผลสัมฤทธิ์ทางการเรียนและเจตคติของนักเรียน ข้อใดเป็นตัวแปรต้น", "choices": ["ผลสัมฤทธิ์ทางการเรียนและเจตคติของนักเรียน", "กิจกรรมการเรียนรู้แบบร่วมมือโดยใช้เทคนิคการจัดกลุ่มแบบคละผลสัมฤทธิ์ทางการเรียน", "นักเรียนที่เข้าร่วมการวิจัย", "คะแนนก่อนเรียนและหลังเรียน"], "answer": 1, "explain": "ตัวแปรต้นคือสิ่งที่ผู้วิจัยจัดหรือเปลี่ยนเพื่อศึกษาผล ในกรณีนี้คือรูปแบบกิจกรรมการเรียนรู้ ส่วนผลสัมฤทธิ์และเจตคติเป็นผลที่นำมาวัด", "wrong": "ผลสัมฤทธิ์และเจตคติเป็นผลที่ต้องการดู ไม่ใช่สิ่งที่ผู้วิจัยเปลี่ยน กลุ่มนักเรียนเป็นหน่วย/กลุ่มตัวอย่าง", "knowledge": "เทคนิคจำ: นักวิจัยเปลี่ยนอะไร = ตัวแปรต้น; แล้ววัดอะไร = ตัวแปรตาม", "trap": "อย่าสับสนระหว่างสิ่งที่จัดให้กับผลที่เกิดขึ้น"}, {"id": "q02", "category": "การวัด ประเมินผล และการวิจัยทางการศึกษา", "type": "วิเคราะห์ข้อมูลการประเมิน", "level": "Level 3", "question": "นักเรียนได้คะแนนระหว่างเรียน 25 จาก 50 คะแนน กลางภาค 12 จาก 20 คะแนน และปลายภาค 20 จาก 30 คะแนน หากเกณฑ์ผ่านคือร้อยละ 60 ของคะแนนรวม นักเรียนควรได้รับผลอย่างไร", "choices": ["ไม่ผ่าน เพราะคะแนนระหว่างเรียนต่ำกว่าร้อยละ 60", "ไม่ผ่าน เพราะคะแนนรวมต่ำกว่าร้อยละ 60", "ผ่าน เพราะคะแนนรวมตั้งแต่ร้อยละ 60 ขึ้นไป", "ผ่าน เพราะคะแนนปลายภาคสูงกว่าร้อยละ 60"], "answer": 1, "explain": "คะแนนรวมคือ 25+12+20 = 57 จาก 100 หรือร้อยละ 57 จึงต่ำกว่าเกณฑ์ร้อยละ 60 และไม่ผ่าน", "wrong": "โจทย์กำหนดให้ใช้คะแนนรวม จึงไม่ควรตัดสินจากคะแนนเพียงส่วนใดส่วนหนึ่ง", "knowledge": "อ่านเกณฑ์ตัดสินก่อน แล้วคำนวณตามเกณฑ์นั้น อย่าเปลี่ยนเกณฑ์เอง", "trap": "คะแนนบางส่วนอาจสูงกว่า 60% เพื่อดึงให้ใช้เกณฑ์ผิด"}, {"id": "q03", "category": "หลักสูตร ศาสตร์การสอน และเทคโนโลยีดิจิทัล", "type": "วิเคราะห์สถานการณ์การจัดการเรียนรู้", "level": "Level 3", "question": "ครูต้องการออกแบบกิจกรรมให้สอดคล้องกับจุดประสงค์การเรียนรู้และธรรมชาติของผู้เรียน แนวทางใดควรพิจารณาเป็นหลัก", "choices": ["เลือกกิจกรรมที่ครูดำเนินการได้ง่ายและใช้เวลาน้อยที่สุด", "เลือกกิจกรรมจากสื่อที่มีอยู่ก่อน แล้วจึงปรับจุดประสงค์ให้เข้ากับกิจกรรม", "เชื่อมจุดประสงค์ ลักษณะผู้เรียน และกิจกรรมให้สนับสนุนกัน", "ใช้รูปแบบการสอนเดียวกันทุกห้องเพื่อให้เป็นมาตรฐาน"], "answer": 2, "explain": "การออกแบบควรสอดคล้องระหว่างจุดประสงค์ ผู้เรียน กิจกรรม และการประเมิน กิจกรรมจึงไม่ควรถูกเลือกแยกจากเป้าหมายและธรรมชาติผู้เรียน", "wrong": "ตัวเลือกอื่นเน้นความสะดวก สื่อที่มี หรือความเหมือนกัน แต่ไม่ได้เริ่มจากความสอดคล้องกับผลการเรียนรู้และผู้เรียน", "knowledge": "คิดเป็นห่วงโซ่: เป้าหมาย → ผู้เรียน → กิจกรรม → หลักฐานการเรียนรู้", "trap": "สะดวกที่สุดหรือเหมือนกันทุกห้องไม่ได้แปลว่าเหมาะสมที่สุด"}, {"id": "q04", "category": "การประกันคุณภาพและการบริหารจัดการ", "type": "วิเคราะห์แนวคิดการประกันคุณภาพ", "level": "Level 3", "question": "ข้อใดสะท้อนเป้าหมายของการประกันคุณภาพการศึกษาที่เหมาะสมที่สุด", "choices": ["จัดทำเอกสารให้ครบเพื่อให้ผ่านการตรวจประเมิน", "ใช้ข้อมูลและหลักฐานเพื่อตรวจสอบและพัฒนาคุณภาพการศึกษาอย่างต่อเนื่อง", "รอรับการประเมินภายนอกแล้วจึงเริ่มปรับปรุงโรงเรียน", "มุ่งให้คะแนนการประเมินสูงที่สุดโดยไม่จำเป็นต้องเชื่อมกับการพัฒนาผู้เรียน"], "answer": 1, "explain": "แก่นของการประกันคุณภาพคือใช้ระบบและหลักฐานสะท้อนคุณภาพและนำผลไปพัฒนาอย่างต่อเนื่อง ไม่ใช่ทำเอกสารเพื่อผ่านการตรวจ", "wrong": "ตัวเลือกอื่นทำให้การประกันคุณภาพกลายเป็นงานเอกสารหรือเตรียมรับการตรวจ ซึ่งไม่ใช่เป้าหมายสูงสุด", "knowledge": "จำเป็นวงจร: วางแผน → ดำเนินการ → ตรวจสอบ → ใช้ผลปรับปรุง → ทำซ้ำ", "trap": "คำว่า ผ่านการประเมิน ไม่ใช่เป้าหมายสูงสุดของการพัฒนาคุณภาพ"}, {"id": "q05", "category": "การวัด ประเมินผล และการวิจัยทางการศึกษา", "type": "วิเคราะห์ผลวิจัย", "level": "Level 4", "question": "นักวิจัยต้องการเปรียบเทียบผลสัมฤทธิ์ของผู้เรียนระหว่างกลุ่มที่ได้รับวิธีสอนสองรูปแบบ และต้องการตรวจสอบว่าความแตกต่างมีนัยสำคัญทางสถิติหรือไม่ ข้อมูลใดมีประโยชน์โดยตรงต่อการตัดสินใจ", "choices": ["ค่าเฉลี่ยของแต่ละกลุ่มเพียงอย่างเดียว", "จำนวนสมาชิกของกลุ่มเพียงอย่างเดียว", "ผลการทดสอบทางสถิติร่วมกับค่าระดับนัยสำคัญและบริบทของการวิจัย", "ความคิดเห็นของผู้สอนเกี่ยวกับวิธีสอน"], "answer": 2, "explain": "ค่าเฉลี่ยบอกความแตกต่างของข้อมูล แต่ไม่พอสำหรับสรุปนัยสำคัญทางสถิติ ต้องพิจารณาผลการทดสอบและระดับนัยสำคัญตามเกณฑ์", "wrong": "ค่าเฉลี่ยอย่างเดียวไม่เพียงพอ จำนวนสมาชิกเป็นข้อมูลประกอบ และความคิดเห็นครูไม่ใช่หลักฐานสถิติสำหรับข้อสรุปนี้", "knowledge": "แยกขนาด/ทิศทางของผลออกจากหลักฐานว่าส่วนต่างมีนัยสำคัญ แล้วพิจารณาร่วมกัน", "trap": "ค่าเฉลี่ยสูงกว่าไม่ได้แปลว่าต่างอย่างมีนัยสำคัญเสมอ"}], "lessons": [{"category": "การวัดและประเมินผล", "title": "ตัวแปรต้นและตัวแปรตาม", "content": "ตัวแปรต้นคือสิ่งที่ผู้วิจัยจัดหรือเปลี่ยนเพื่อศึกษาผล ส่วนตัวแปรตามคือผลที่นำมาสังเกตหรือวัด", "memory": "นักวิจัยเปลี่ยนอะไร = ต้น; แล้ววัดอะไร = ตาม"}, {"category": "การวัดและประเมินผล", "title": "การตัดสินผลตามเกณฑ์", "content": "ก่อนคำนวณต้องอ่านให้ชัดว่าโจทย์กำหนดเกณฑ์จากคะแนนส่วนใดหรือคะแนนรวม จากนั้นจึงคำนวณตามเกณฑ์ที่กำหนด", "memory": "อย่าเปลี่ยนเกณฑ์เองเพราะคะแนนบางส่วนดูเหมือนผ่าน"}, {"category": "ศาสตร์การสอน", "title": "ความสอดคล้องของการออกแบบ", "content": "จุดประสงค์ ผู้เรียน กิจกรรม และการประเมินควรสนับสนุนกัน การเลือกกิจกรรมเพียงเพราะสะดวกหรือมีสื่ออยู่แล้วไม่รับประกันผลการเรียนรู้", "memory": "เป้าหมาย → ผู้เรียน → กิจกรรม → หลักฐาน"}, {"category": "การประกันคุณภาพ", "title": "ประกันคุณภาพเพื่อพัฒนา", "content": "ข้อมูลและหลักฐานมีคุณค่าเมื่อถูกใช้ตรวจสอบและพัฒนาการจัดการศึกษาอย่างต่อเนื่อง ไม่ใช่ทำเอกสารเพื่อผ่านการประเมินเพียงอย่างเดียว", "memory": "วางแผน → ทำ → ตรวจสอบ → ปรับปรุง"}, {"category": "การวิจัยทางการศึกษา", "title": "อ่านผลวิจัยอย่างมีเหตุผล", "content": "ค่าเฉลี่ยช่วยบอกภาพของข้อมูล แต่การสรุปนัยสำคัญต้องดูผลการทดสอบและระดับนัยสำคัญร่วมกับบริบทของงานวิจัย", "memory": "อย่าสรุปจากค่าเฉลี่ยอย่างเดียว"}]};
let state=JSON.parse(localStorage.getItem('tq8')||'null')||{xp:0,answered:0,correct:0,qIndex:0,selected:null,submitted:false};
function save(){localStorage.setItem('tq8',JSON.stringify(state))}
function go(p){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));({home,learn,exam,analysis}[p])()}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
function home(){root.innerHTML=`<div class="top"><div class="logo">🌷 Teacher Quest V8</div><div class="pill">⭐ ${state.xp} XP</div></div><section class="hero"><span class="tag">MISSION • ฝึกคิดแบบข้อสอบ</span><h1>พร้อมเป็นครูที่คิดเป็นหรือยัง?</h1><p class="muted">เรียน → ฝึก → ทำข้อสอบ → วิเคราะห์</p><button class="bigbtn" data-action="exam">📝 เริ่มทำข้อสอบ</button><button class="bigbtn ghost" data-action="learn">📚 ไปเรียน</button></section><div class="grid"><div class="card"><h3>🧠 ฝึกคิด</h3><span class="muted">เน้นหลักการ ไม่จับ keyword</span></div><div class="card"><h3>🎯 รู้จุดอ่อน</h3><span class="muted">ดูผลการทำข้อสอบ</span></div></div>`;bindActions()}
function learn(){root.innerHTML=`<div class="top"><div class="logo">📚 ห้องเรียน</div><div class="pill">${DATA.lessons.length} บท</div></div><p class="muted">หน้านี้มีเฉพาะเนื้อหาสำหรับเรียน</p>${DATA.lessons.map((l,i)=>`<article class="card"><span class="tag">${l.category}</span><h3>${i+1}. ${l.title}</h3><p>${l.content}</p><b>🔑 จำให้ได้</b><p>${l.memory}</p></article>`).join('')}`}
function exam(){const q=DATA.questions[state.qIndex%DATA.questions.length];root.innerHTML=`<div class="top"><div class="logo">📝 ข้อสอบ</div><div class="pill">ข้อ ${state.qIndex+1}</div></div><section class="qbox"><div><span class="tag">${q.category}</span> <span class="tag">${q.type}</span> <span class="tag">${q.level}</span></div><h2>${q.question}</h2>${q.choices.map((c,i)=>`<button class="choice ${state.selected===i?'selected':''} ${state.submitted&&i===q.answer?'correct':''} ${state.submitted&&state.selected===i&&i!==q.answer?'wrong':''}" data-choice="${i}">${c}</button>`).join('')}${state.submitted?`<div class="result"><h3>${state.selected===q.answer?'✅ ถูกต้อง':'❌ ยังไม่ถูก'}</h3><p><b>ทำไม:</b> ${q.explain}</p><p><b>ทำไมตัวเลือกอื่นไม่ใช่:</b> ${q.wrong}</p><p><b>🧠 ความรู้เสริม:</b> ${q.knowledge}</p><p><b>🎯 จุดหลอก:</b> ${q.trap}</p></div><button class="bigbtn" data-action="next">ไปข้อถัดไป →</button>`:`<button class="bigbtn" data-action="submit">ตรวจคำตอบ</button>${state.selected!==null?`<button class="bigbtn ghost" data-action="clear">ยกเลิกคำตอบ</button>`:''}`}</section>`;bindExam()}
function bindExam(){document.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{if(!state.submitted){const i=+b.dataset.choice;state.selected=state.selected===i?null:i;save();exam()}}));document.querySelector('[data-action="submit"]')?.addEventListener('click',()=>{if(state.selected===null){alert('เลือกคำตอบก่อนครับ');return}const q=DATA.questions[state.qIndex%DATA.questions.length];state.submitted=true;state.answered++;state.selected===q.answer?(state.correct++,state.xp+=20):state.xp+=5;save();exam()});document.querySelector('[data-action="clear"]')?.addEventListener('click',()=>{state.selected=null;save();exam()});document.querySelector('[data-action="next"]')?.addEventListener('click',()=>{state.qIndex++;state.selected=null;state.submitted=false;save();exam()})}
function bindActions(){document.querySelectorAll('[data-action="exam"]').forEach(b=>b.addEventListener('click',()=>go('exam')));document.querySelectorAll('[data-action="learn"]').forEach(b=>b.addEventListener('click',()=>go('learn')))}
function analysis(){const pct=state.answered?Math.round(state.correct/state.answered*100):0;root.innerHTML=`<div class="top"><div class="logo">📊 วิเคราะห์</div></div><div class="stats"><div class="stat"><b>${state.answered}</b>ทำแล้ว</div><div class="stat"><b>${state.correct}</b>ถูก</div><div class="stat"><b>${pct}%</b>ความแม่น</div></div><article class="card"><h3>🔎 วิเคราะห์การเรียนรู้</h3><p>ระบบจะใช้หมวดและประเภทของข้อสอบเพื่อหาจุดแข็ง/จุดอ่อน เมื่อเพิ่มคลังข้อสอบเต็มรูปแบบ</p><p class="muted">ข้อมูลชุดนี้เป็นชุดสาธิตที่จัดโครงสร้างจากไฟล์ที่อ่านได้</p></article>`}
go('home');
</script></body></html>
