{q:"ผู้เรียนหลายคนอ่านไม่คล่อง ควรเก็บข้อมูลใดก่อน",o:["ตัวอย่างการอ่านและรูปแบบข้อผิดพลาด","คะแนนสอบปลายภาคอย่างเดียว","ความเห็นจากเพื่อนคนเดียว","จำนวนการบ้าน"],a:"ตัวอย่างการอ่านและรูปแบบข้อผิดพลาด"}]}
];

const state=JSON.parse(localStorage.getItem("TQ8")||"{}");state.xp??=0;state.streak??=0;state.learned??=[];state.answers??={};
const $=s=>document.querySelector(s), esc=x=>String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
function save(){localStorage.setItem("TQ8",JSON.stringify(state));$("#xp").textContent=state.xp;$("#streak").textContent=state.streak}
function go(x){location.hash=x;render()}
function home(){return `<section class=hero><h1>เตรียมสอบครูแบบคิดเป็น 🎓</h1><p>แยกชัดเจน: เรียน • เล่น • ข้อสอบ • วิเคราะห์<br>ข้อสอบจะใช้เฉพาะคลังต้นฉบับที่ตรวจสอบได้</p><button class="cta" onclick="go('learn')">เริ่มเรียน</button></section><section class=section><div class=title>เลือกเส้นทาง</div><div class=grid><div class=card><button onclick="go('learn')"><div class=icon>📚</div><b>ห้องเรียน</b><div class=muted>ความรู้เป็นหมวดและบทเรียนย่อย</div></button></div><div class=card><button onclick="go('play')"><div class=icon>🎮</div><b>กิจกรรม</b><div class=muted>เกมฝึกคิด ไม่ปนข้อสอบ</div></button></div><div class=card><button onclick="go('exam')"><div class=icon>📝</div><b>ข้อสอบ</b><div class=muted>ทีละข้อ ไม่มี A/B/C/D/E</div></button></div><div class=card><button onclick="go('analysis')"><div class=icon>📊</div><b>วิเคราะห์</b><div class=muted>ดูจุดแข็งและจุดอ่อน</div></button></div></div></section><section class=section><div class=notice><b>V8</b> แก้ระบบตอบซ้ำได้ก่อนส่ง, เฉลยคนละหน้ากับโจทย์, แสดงหมวดและประเภทโจทย์, บันทึกความก้าวหน้า</div></section>`}
function learn(){let cs=[...new Set(lessons.map(x=>x[1]))];return `<section class=section><div class=title>📚 ห้องเรียน</div><div class=sub>หน้านี้มีเฉพาะเนื้อหาให้เรียน</div><div class=list>${cs.map(c=>{let a=lessons.filter(x=>x[1]===c);return `<button class=lesson-btn onclick="cat(${JSON.stringify(c)})"><b>${a[0][0]} ${esc(c)}</b><span class=muted>${a.length} บทเรียน</span></button>`}).join("")}</div></section>`}
function cat(c){state.cat=c;save();go("cat")}
function catPage(){let a=lessons.filter(x=>x[1]===state.cat);return `<section class=section><button class=back onclick="go('learn')">← กลับ</button><div class=title>${a[0][0]} ${esc(state.cat)}</div><div class=list>${a.map((x,i)=>`<button class=lesson-btn onclick="lesson(${lessons.indexOf(x)})"><b>${esc(x[2])}</b><span class=muted>${state.learned.includes(lessons.indexOf(x))?"✓ เรียนแล้ว":"ยังไม่ได้เรียน"}</span></button>`).join("")}</div></section>`}
function lesson(i){state.li=i;save();go("lesson")}
function lessonPage(){let x=lessons[state.li];if(!state.learned.includes(state.li)){state.learned.push(state.li);state.xp+=10;save()}return `<section class=lesson><button class=back onclick="cat(${JSON.stringify(x[1])})">← กลับ</button><span class=tag>${x[0]} ${esc(x[1])}</span><h2>${esc(x[2])}</h2><p><b>แก่นความรู้</b><br>${esc(x[3])}</p><div class=box><b>💡 เทคนิคทำข้อสอบ</b><br>${esc(x[4])}</div><div class=box><b>🧠 เทคนิคจำ</b><br>${esc(x[5])}</div></section>`}
function play(){return `<section class=section><div class=title>🎮 สนามกิจกรรม</div><div class=sub>กิจกรรมฝึกคิด ไม่ปนกับข้อสอบจริง</div><div class=grid>${activities.map(a=>`<div class=card><button onclick="startGame('${a.id}')"><div class=icon>${a.icon}</div><b>${esc(a.name)}</b><div class=muted>${esc(a.desc)}</div></button></div>`).join("")}</div></section>`}
function startGame(id){state.g=id;state.gi=0;save();go("game")}
function game(){let g=activities.find(x=>x.id===state.g),it=g.items[state.gi];return `<section class=section><button class=back onclick="go('play')">← กลับ</button><div class=qcard><span class=tag>${g.icon} ${esc(g.name)}</span><div class=title>${esc(it.q)}</div><div id=go>${it.o.slice().sort(()=>Math.random()-.5).map(o=>`<button class=option onclick="gp(this,${JSON.stringify(o)},${JSON.stringify(it.a)})">${esc(o)}</button>`).join("")}</div><div id=gm></div></div></section>`}
function gp(b,v,a){document.querySelectorAll("#go .option").forEach(x=>x.disabled=true);b.classList.add(v===a?"correct":"wrong");$("#gm").innerHTML=`<div class=explain><b>${v===a?"ถูกต้อง 🎉":"ยังไม่ใช่"}</b><br>${v===a?"เหตุผลสอดคล้องกับหลักการ":"ลองกลับไปดูแก่นของบทเรียน"}<br><button class=primary onclick="gn()">ไปต่อ</button></div>`}
function gn(){let g=activities.find(x=>x.id===state.g);state.gi++;if(state.gi>=g.items.length){state.xp+=20;save();go("play")}else render()}
function exam(){let b=(JSON.parse(localStorage.getItem("TQ8_EXAM")||"null")||{questions:[]}).questions;return `<section class=section><div class=title>📝 สนามข้อสอบ</div><div class=sub>กติกา: ใช้เฉพาะข้อที่ตรวจสอบแล้วจากไฟล์ต้นฉบับ</div><div class=notice><b>คลังข้อสอบต้นฉบับยังไม่ได้ฝังใน V8</b><br>ไฟล์ PDF ที่อยู่ในระบบสนทนาปัจจุบันไม่สามารถดึงข้อความ/ไบนารีได้ จึงไม่สร้างข้อสอบปลอมแทนไฟล์</div><div class=filebox><b>ถ้ามี questions.json ที่ตรวจแล้ว สามารถนำเข้าได้</b><input type=file accept=.json onchange="imp(this.files[0])"><div class=muted>โครงสร้างอยู่ใน README.txt</div></div>${b.length?`<button class=primary style="width:100%;margin-top:12px" onclick="startExam()">เริ่ม ${b.length} ข้อ</button>`:""}</section>`}
function imp(f){let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.questions))throw 0;localStorage.setItem("TQ8_EXAM",JSON.stringify(d));alert("นำเข้าคลังข้อสอบแล้ว");render()}catch(e){alert("JSON ไม่ถูกต้อง")}};r.readAsText(f)}
function startExam(){state.ex=JSON.parse(localStorage.getItem("TQ8_EXAM"));state.ei=0;state.order=null;save();go("examq")}
function examq(){let x=state.ex.questions[state.ei];if(!x)return done();if(!state.order)state.order=x.options.slice().sort(()=>Math.random()-.5);return `<section class=section><span class=tag>${esc(x.category)}</span><span class=tag>${esc(x.type)}</span><span class=tag>ข้อ ${state.ei+1}/${state.ex.questions.length}</span><div class=progress><i style="width:${state.ei/state.ex.questions.length*100}%"></i></div><div class=qcard><div class=title>${esc(x.question)}</div><div id=opts>${state.order.map(o=>`<button class=option data-v="${encodeURIComponent(o)}" onclick="pick(this)">${esc(o)}</button>`).join("")}</div><div class=actions><button class=secondary onclick="cancelPick()">ยกเลิกคำตอบ</button><button class=primary onclick="submitQ()">ส่งคำตอบ</button></div><div class=muted>ยังแก้ได้จนกว่าจะกดส่ง</div></div></section>`}
function pick(b){document.querySelectorAll("#opts .option").forEach(x=>x.classList.remove("selected"));b.classList.toggle("selected")}
function cancelPick(){document.querySelectorAll("#opts .option").forEach(x=>x.classList.remove("selected"))}
function submitQ(){let x=state.ex.questions[state.ei],b=document.querySelector("#opts .selected");if(!b)return alert("กรุณาเลือกคำตอบก่อน");let v=decodeURIComponent(b.dataset.v),ok=v===x.answer;state.answers[x.id]={ok,category:x.category};state.xp+=ok?20:3;state.streak=ok?state.streak+1:0;state.res={x,v,ok};state.order=null;save();go("explain")}
function explain(){let r=state.res,x=r.x;return `<section class=section><div class=qcard><span class=tag>${esc(x.category)}</span><span class=tag>${esc(x.type)}</span><div class=title>${r.ok?"✓ ตอบถูก":"✗ ตอบผิด"}</div><div class=explain>คุณตอบ: <b>${esc(r.v)}</b><br>คำตอบที่ถูก: <b>${esc(x.answer)}</b></div><div class=explain><b>ทำไม?</b><br>${esc(x.explanation)}</div><div class=explain><b>ความรู้เสริม</b><br>${esc(x.teaching||"ไม่มีข้อมูลเสริมในต้นฉบับ")}</div><div class=explain><b>แหล่งที่มา</b><br>${esc(x.source||"ไม่ระบุ")}</div><button class=primary style="width:100%;margin-top:12px" onclick="nextQ()">ไปข้อถัดไป →</button></div></section>`}
function nextQ(){state.ei++;save();go("examq")}
function done(){return `<section class=hero><h1>จบด่านแล้ว 🎉</h1><p>ผลถูกบันทึกไว้ในห้องวิเคราะห์</p><button class=cta onclick="go('analysis')">ดูผล</button></section>`}
function analysis(){let cs=[...new Set(lessons.map(x=>x[1]))];return `<section class=section><div class=title>📊 ห้องวิเคราะห์</div><div class=sub>มีเฉพาะข้อมูลวิเคราะห์ ไม่ปนบทเรียน</div><div class=card><b>ความก้าวหน้า</b><p>เรียนแล้ว ${state.learned.length}/${lessons.length} บท · XP ${state.xp}</p></div><div class=list>${cs.map(c=>{let a=Object.values(state.answers).filter(x=>x.category===c),p=a.length?Math.round(a.filter(x=>x.ok).length/a.length*100):0;return `<div class=card><b>${esc(c)}</b><div style="display:flex;gap:10px;align-items:center;margin-top:8px"><div class=bar style="flex:1"><i style="width:${p}%"></i></div><b>${p}%</b></div><div class=muted>${a.length?"ทำแล้ว "+a.length+" ข้อ":"ยังไม่มีข้อมูลข้อสอบ"}</div></div>`}).join("")}</div></section>`}
function render(){save();let p=location.hash.slice(1)||"home";let f={home,learn,cat:catPage,lesson:lessonPage,play,game,exam,examq,explain,analysis}[p]||home;$("#view").innerHTML=f()}
addEventListener("hashchange",render);render();
</script></body></html>
